<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LandinPage: make every visual decision for your landing page, step by step, and export a build-ready JSON spec." />
    <script>
      // Apply the saved theme before first paint (same key as components/theme-provider.jsx).
      (function () {
        try {
          var t = localStorage.getItem("landinpage-theme") || "system"
          var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches)
          document.documentElement.classList.toggle("dark", dark)
          document.documentElement.style.colorScheme = dark ? "dark" : "light"
        } catch (e) {}
      })()
    </script>
    <title>LandinPage: Design decisions for landing pages</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
